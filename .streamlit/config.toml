# Visual theme — UW Foster purple instead of Streamlit's default red (which reads as "error").
[theme]
base = "light"
primaryColor = "#4B2E83"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4FB"
textColor = "#1F2937"
linkColor = "#4B2E83"
linkUnderline = false
headingFontSizes = ["2rem", "1.55rem", "1.25rem", "1.05rem"]
metricValueFontSize = "1.7rem"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
borderColor = "#E7E3F1"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#F6F4FB"
